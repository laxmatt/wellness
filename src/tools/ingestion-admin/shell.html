<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Partner ingestion (local only)</title>
    <style>
      :root { color-scheme: light; --edge: #ddd6cc; --bad: #8a2b1f; --warn: #7a5a12; --ok: #245b3a; --ink: #22201d; --soft: #5d574f; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 0 0 5rem; background: #faf7f2; color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 1180px; margin: 0 auto; padding: 0 1rem; }
      h1 { font-size: 1.6rem; margin: 1rem 0 .25rem; }
      h2 { font-size: 1.15rem; margin: 2rem 0 .5rem; }
      h3 { font-size: .95rem; margin: 1rem 0 .3rem; }
      p { margin: .4rem 0; }
      .banner { border: 1px solid var(--edge); border-left: 4px solid var(--bad); background: #fff; padding: .75rem 1rem; border-radius: 6px; margin: 1rem 0; }
      .banner strong { display: block; }
      .status { border: 1px solid var(--edge); background: #fff; border-radius: 6px; padding: .6rem .9rem; margin: 1rem 0; }
      .status.ok { border-left: 4px solid var(--ok); }
      .status.bad { border-left: 4px solid var(--bad); }
      .status ul { margin: .4rem 0 0; padding-left: 1.1rem; }
      .panel { border: 1px solid var(--edge); background: #fff; border-radius: 6px; padding: 1rem; margin: .75rem 0; }
      label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .2rem; }
      input[type="text"], input[type="url"], select, textarea { width: 100%; padding: .3rem; font: inherit; font-size: .9rem; border: 1px solid var(--edge); border-radius: 4px; background: #fff; }
      textarea { min-height: 3.5rem; }
      .fields { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
      button { font: inherit; padding: .35rem .8rem; border: 1px solid var(--edge); background: #fff; border-radius: 4px; cursor: pointer; }
      button:hover:not([disabled]) { background: #f3efe8; }
      button[disabled] { color: var(--soft); cursor: default; }
      button.primary { border-color: var(--ok); color: var(--ok); font-weight: 600; }
      button.danger { border-color: var(--bad); color: var(--bad); }
      .actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .7rem; align-items: center; }
      table { border-collapse: collapse; width: 100%; font-size: .84rem; }
      th, td { text-align: left; vertical-align: top; padding: .3rem .45rem; border-top: 1px solid var(--edge); }
      th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--soft); border-top: 0; }
      td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; white-space: pre-wrap; word-break: break-word; }
      .pill { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--edge); border-radius: 999px; padding: .05rem .5rem; color: var(--soft); white-space: nowrap; }
      .pill.bad { border-color: var(--bad); color: var(--bad); }
      .pill.warn { border-color: var(--warn); color: var(--warn); }
      .pill.ok { border-color: var(--ok); color: var(--ok); }
      .note { font-size: .82rem; color: var(--soft); }
      .err { color: var(--bad); font-size: .82rem; margin: .2rem 0 0; }
      .row { border: 1px solid var(--edge); border-left: 4px solid var(--edge); background: #fff; border-radius: 6px; padding: .7rem; margin: .6rem 0; }
      .row.added { border-left-color: var(--ok); }
      .row.conflict, .row.failed { border-left-color: var(--bad); }
      .row.review, .row.changed { border-left-color: var(--warn); }
      .row header { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
      details summary { cursor: pointer; font-size: .86rem; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
      a { color: #1d4e89; }
    </style>
  </head>
  <body>
    <main>
      <h1>Partner ingestion</h1>
      <div class="banner">
        <strong>Local only, and nothing here publishes.</strong>
        Records land in <code>ingestion/drafts</code> on this machine, which the site does not read. Approving a mapping, importing
        drafts, reviewing a listing and publishing are four separate decisions, and the last one has no button here.
      </div>
      <div id="app"></div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
